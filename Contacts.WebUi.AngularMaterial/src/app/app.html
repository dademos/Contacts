<header>

      mat-button
      routerLink="/"
      routerLinkActive="link-active"
      [routerLinkActiveOptions]="{ exact: true }"
      ariaCurrentWhenActive="page"
      >About</a
    >
    <a mat-button routerLink="/contacts" routerLinkActive="link-active" ariaCurrentWhenActive="page"

    >

    <mat-card-content>
      <router-outlet />
    </mat-card-content>
  </mat-card>
</main>
