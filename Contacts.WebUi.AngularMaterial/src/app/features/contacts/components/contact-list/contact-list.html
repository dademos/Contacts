<div>
  <div class="filter-container">
    <app-text-filter label="Search (starts with)" (value)="onSearch($event)" />
  </div>

  <div class="progress-bar-container">
    @if (contactsResource.isLoading() || mutationLoading()) {
      <mat-progress-bar mode="indeterminate"></mat-progress-bar>
    }
  </div>

  <table
    mat-table
    [dataSource]="contacts()"
    recycleRows="true"
    [trackBy]="trackById"
    matSort
    (matSortChange)="onSort($event)"
    [matSortActive]="sortBy()"
    [matSortDirection]="sortDirection()"
    matSortDisableClear="true"
  >
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Name</th>
      <td mat-cell *matCellDef="let row">{{ row.fullName }}</td>
    </ng-container>

    <ng-container matColumnDef="email">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Email</th>
      <td mat-cell *matCellDef="let row">
        @if (row.email) {
          <a href="mailto:{{ row.email }}">{{ row.email }}</a>
        }
      </td>
    </ng-container>

    <ng-container matColumnDef="phone">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Phone</th>
      <td mat-cell *matCellDef="let row">
        @if (row.phone) {
          <a href="tel:{{ row.phone }}">{{ row.phone }}</a>
        }
      </td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>
        <div class="actions-container">
          <button mat-icon-button matTooltip="Add new contact" (click)="onCreate()">
            <mat-icon>person_add</mat-icon>
          </button>
          <button
            mat-icon-button
            matTooltip="Generate 10 contacts for demo purposes"
            (click)="onGenerate()"
          >
            <mat-icon>group_add</mat-icon>
          </button>
        </div>
      </th>
      <td mat-cell *matCellDef="let row">
        <div class="actions-container">
          <button mat-icon-button matTooltip="Edit" (click)="onEdit(row)">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button matTooltip="Delete" (click)="onDelete(row)">
            <mat-icon>delete_forever</mat-icon>
          </button>
        </div>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>

  @if (searchTerm() && !contacts().length) {
    <div class="empty-result">No contacts match your search term.</div>
  }

  <mat-paginator
    [length]="totalCount()"
    [pageSize]="pageSize()"
    [pageIndex]="pageIndex()"
    [pageSizeOptions]="[10, 15, 20, 25, 30, 50]"
    (page)="onPage($event)"
    showFirstLastButtons="true"
    [disabled]="contactsResource.isLoading()"
  />
</div>
