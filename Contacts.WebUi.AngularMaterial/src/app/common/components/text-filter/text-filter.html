<mat-form-field subscriptSizing="dynamic">
  <mat-label>{{ label() }}</mat-label>
  <input
    matInput
    [placeholder]="computedPlaceholder()"
    [disabled]="disabled()"
    [value]="text()"
    (input)="text.set($any($event.target).value)"
    (keyup.enter)="onEnter()"
  />
  @if (text()) {
    <button
      mat-icon-button
      matSuffix
      matTooltip="Clear"
      type="button"
      [disabled]="disabled()"
      (click)="onClear()"
      aria-label="Clear filter"
    >
      <mat-icon>close</mat-icon>
    </button>
  }
</mat-form-field>
