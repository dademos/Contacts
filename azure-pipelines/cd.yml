trigger: none

pr: none

resources:
  pipelines:
    - pipeline: ci
      source: Contacts-CI
      trigger:
        branches:
          include:
            - main

stages:
  - stage: Deploy
    displayName: Deploy to production
    jobs:
      - deployment: DeployApp
        displayName: Deploy App
        environment: production
        pool:
          vmImage: ubuntu-latest
        strategy:
          runOnce:
            deploy:
              steps:
                - download: ci
                  artifact: ef-bundle
                  displayName: Download EF migrations bundle artefact

                - download: ci
                  artifact: app
                  displayName: Download API & Angular app artefact

                - download: ci
                  artifact: react
                  displayName: Download React app artefact

                - bash: |
                    chmod +x "$(Pipeline.Workspace)/ci/ef-bundle/efbundle.exe"
                    "$(Pipeline.Workspace)/ci/ef-bundle/efbundle.exe" -v -- "$DB_CONNECTION_STRING"
                  displayName: Apply EF migrations
                  env:
                    DB_CONNECTION_STRING: $(dbConnectionString)

                - task: AzureWebApp@1
                  displayName: Deploy API & Angular app to Azure App Service
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    appName: $(appServiceName)
                    package: $(Pipeline.Workspace)/ci/app/Contacts.WebApi.zip
                    appType: webApp
                    deploymentMethod: runFromPackage

                - task: AzureStaticWebApp@0
                  displayName: Deploy React app to Azure Static Web Apps
                  inputs:
                    azure_static_web_apps_api_token: $(reactSwaDeploymentToken)
                    app_location: ''
                    api_location: ''
                    output_location: ''
                    skip_app_build: true
                    skip_api_build: true
                    workingDirectory: $(Pipeline.Workspace)/ci/react
