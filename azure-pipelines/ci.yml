trigger:
  branches:
    include:
      - main

pr: none

jobs:
  - job: BuildAndTestDotNet
    displayName: Build and test .NET
    pool:
      vmImage: ubuntu-latest
    steps:
      - template: templates/steps-build-backend.yml

      - task: PublishPipelineArtifact@1
        displayName: Publish API project artefact
        inputs:
          targetPath: Contacts.WebApi
          artifact: Contacts.WebApi

      - bash: |
          mkdir -p "$(Build.ArtifactStagingDirectory)/ef-bundle"
          dotnet ef migrations bundle --configuration Release --project Contacts.Data --no-build \
            --target-runtime linux-x64 --self-contained --output "$(Build.ArtifactStagingDirectory)/ef-bundle/efbundle.exe"
        displayName: Build EF migrations bundle

      - task: PublishPipelineArtifact@1
        displayName: Publish EF migrations bundle artefact
        inputs:
          targetPath: $(Build.ArtifactStagingDirectory)/ef-bundle
          artifact: ef-bundle

  - job: BuildAndTestAngular
    displayName: Build and test Angular
    dependsOn: []
    pool:
      vmImage: ubuntu-latest
    steps:
      - template: templates/steps-build-angular.yml

      - task: PublishPipelineArtifact@1
        displayName: Publish Angular build artefact
        inputs:
          targetPath: Contacts.WebUi.AngularMaterial/dist/contacts/browser
          artifact: angular

  - job: BuildAndTestReact
    displayName: Build and test React
    dependsOn: []
    pool:
      vmImage: ubuntu-latest
    steps:
      - template: templates/steps-build-react.yml

      - task: PublishPipelineArtifact@1
        displayName: Publish React build artefact
        inputs:
          targetPath: Contacts.WebUi.ReactShadcn/dist
          artifact: react

  - job: PackageApp
    displayName: Package API & Angular app
    dependsOn:
      - BuildAndTestDotNet
      - BuildAndTestAngular
    condition: succeeded()
    pool:
      vmImage: ubuntu-latest
    steps:
      - checkout: self

      - task: DownloadPipelineArtifact@2
        displayName: Download API project artefact
        inputs:
          artifact: Contacts.WebApi
          path: $(Build.SourcesDirectory)/Contacts.WebApi

      - download: current
        artifact: angular
        displayName: Download Angular build artefact

      - bash: |
          mkdir -p Contacts.WebApi/wwwroot
          cp -a "$(Pipeline.Workspace)/angular/." Contacts.WebApi/wwwroot/
        displayName: Copy Angular app into API wwwroot

      - task: UseDotNet@2
        displayName: Install .NET SDK
        inputs:
          useGlobalJson: true
          checkForExistingVersion: true

      - task: DotNetCoreCLI@2
        displayName: Publish and zip API & Angular app
        inputs:
          command: publish
          projects: Contacts.WebApi/Contacts.WebApi.csproj
          arguments: --configuration Release --output $(Pipeline.Workspace)/app
          publishWebProjects: false

      - task: PublishPipelineArtifact@1
        displayName: Publish API & Angular app artefact
        inputs:
          targetPath: $(Pipeline.Workspace)/app
          artifact: app